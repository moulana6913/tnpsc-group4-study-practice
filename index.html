const lessons={
tamilGrammar:`<h3>1. எழுத்து</h3><p>தமிழில் <b>12 உயிரெழுத்துகள் + 18 மெய்யெழுத்துகள் = 30.</b></p><p>உயிர் + மெய் சேர்ந்து <b>216 உயிர்மெய் எழுத்துகள்</b> உருவாகின்றன.</p><div class="example">30 + 216 + 1 ஆய்த எழுத்து = <b>247</b></div><h3>2. சொல் வகைகள்</h3><p><b>பெயர்ச்சொல்</b> – மனிதர், பொருள், இடம் போன்றவற்றின் பெயர்.</p><div class="example">எ.கா.: ரவி, மரம், சென்னை</div><p><b>வினைச்சொல்</b> – செயலைக் குறிக்கும்.</p><div class="example">எ.கா.: ஓடினான், படிக்கிறான்</div><p><b>உரிச்சொல்</b> – பெயர்ச்சொல்லின் தன்மையை விளக்கும்.</p><div class="example">எ.கா.: அழகான மலர்</div><p><b>இடைச்சொல்</b> – சொற்களுக்கு இடையே தொடர்பை ஏற்படுத்தும்.</p><div class="example">எ.கா.: மற்றும், ஆனால்</div><h3>3. காலங்கள்</h3><ul><li><b>இறந்தகாலம்:</b> சென்றான்</li><li><b>நிகழ்காலம்:</b> செல்கிறான்</li><li><b>எதிர்காலம்:</b> செல்வான்</li></ul><h3>4. திணை</h3><ul><li><b>உயர்திணை</b> – மனிதர்களைக் குறிக்கும்.</li><li><b>அஃறிணை</b> – மனிதர் அல்லாதவற்றைக் குறிக்கும்.</li></ul><h3>5. பால்</h3><ul><li>ஆண்பால்</li><li>பெண்பால்</li><li>பலர்பால்</li><li>ஒன்றன்பால்</li><li>பலவின்பால்</li></ul><h3>6. இடம்</h3><ul><li><b>தன்மை:</b> நான், நாம்</li><li><b>முன்னிலை:</b> நீ, நீங்கள்</li><li><b>படர்க்கை:</b> அவன், அவள், அவர்கள்</li></ul><h3>7. எச்சம்</h3><p><b>வினையெச்சம்:</b> ஓடி வந்தான், பாடி மகிழ்ந்தான்</p><p><b>பெயரெச்சம்:</b> வந்த மாணவன், பாடிய பறவை</p>`,

<h3>📘 சொல்லகராதி </h3>

<p>
  சொல்லகராதி என்பது ஒரு சொல்லின் பொருள், இணைச்சொல், எதிர்ச்சொல்,
  சரியான பயன்பாடு போன்றவற்றை அறிந்து கொள்வதாகும்.
  TNPSC Group 4 தமிழ் பகுதியில் இது முக்கியமானது.
</p>

<h4>1. பொருள் அறிதல்</h4>

<p>ஒரு சொல்லுக்கு சரியான பொருளை கண்டுபிடித்தல்.</p>

<table class="b">
  <tr>
    <th>சொல்</th>
    <th>பொருள்</th>
  </tr>
  <tr>
    <td>அகம்</td>
    <td>உள்ளம் / வீடு</td>
  </tr>
  <tr>
    <td>புறம்</td>
    <td>வெளியிடம்</td>
  </tr>
  <tr>
    <td>ஈகம்</td>
    <td>கொடை</td>
  </tr>
  <tr>
    <td>அன்பு</td>
    <td>நேசம்</td>
  </tr>
  <tr>
    <td>வனம்</td>
    <td>காடு</td>
  </tr>
  <tr>
    <td>சோலை</td>
    <td>தோட்டம்</td>
  </tr>
</table>


<h4>2. இணைச்சொல்</h4>

<p>ஒரே அல்லது நெருங்கிய பொருள் தரும் சொற்கள்.</p>

<div class="example">கடல் — சமுத்திரம்</div>
<div class="example">மலை — குன்று</div>
<div class="example">வீடு — இல்லம்</div>
<div class="example">அரசன் — மன்னன்</div>
<div class="example">சூரியன் — கதிரவன்</div>
<div class="example">பூ — மலர்</div>


<h4>3. எதிர்ச்சொல்</h4>

<p>மாறுபட்ட பொருள் தரும் சொற்கள்.</p>

<div class="example">நன்மை × தீமை</div>
<div class="example">இன்பம் × துன்பம்</div>
<div class="example">உயர்வு × தாழ்வு</div>
<div class="example">பகல் × இரவு</div>
<div class="example">பிறப்பு × இறப்பு</div>
<div class="example">உண்மை × பொய்</div>


<h4>4. ஒரு சொல் – பல பொருள்</h4>

<p>
  ஒரே சொல் வெவ்வேறு சூழலில் வெவ்வேறு பொருள் தரலாம்.
</p>

<div class="example"><b>கால்</b></div>
<div class="example">மனிதனின் கால்</div>
<div class="example">நாற்காலியின் கால்</div>
<div class="example">கால்பங்கு</div>


<h4>5. சொல் பயன்பாடு</h4>

<p>சொல்லை சரியான இடத்தில் பயன்படுத்த வேண்டும்.</p>

<div class="example">“வளம்” → செல்வம் / செழிப்பு</div>
<div class="example">“வலம்” → சுற்றி வருதல்</div>

<div class="example">👉 வளம் மிகுந்த நாடு.</div>
<div class="example">👉 கோவிலை வலம் வந்தார்.</div>
<h4>6. ஒரே ஒலி – வேறு பொருள்</h4>

<p>
  ஒலியில் ஒரே மாதிரியாக அல்லது நெருக்கமாக இருக்கும்;
  ஆனால் பொருள் வேறுபடும்.
</p>

<p><b>எடுத்துக்காட்டு:</b></p>

<div class="example">அலை → கடல் அலை</div>
<div class="example">அளை → சிறு அறை / குகை</div>


<h4>7. சரியான சொல்லைத் தேர்ந்தெடுத்தல்</h4>

<p>
  கொடுக்கப்பட்ட சொற்களில் சரியான சொல்லைத் தேர்வு செய்தல்.
</p>

<p><b>எடுத்துக்காட்டு:</b></p>

<div class="example">❌ தமிழ்நாடு நாடு</div>
<div class="example">✅ தமிழ்நாடு</div>


<h4>8. சொல் பயன்பாடு</h4>

<p>
  ஒரு சொல்லை சரியான பொருளிலும், சரியான வாக்கியத்திலும் பயன்படுத்துதல்.
</p>

<p><b>எடுத்துக்காட்டு:</b></p>

<div class="example">

simplification:`<h3>➗ Simplification</h3><p>கணிதக் கணக்குகளை சரியான வரிசையில் எளிமைப்படுத்துவது Simplification.</p><div class="example">BODMAS: அடைப்புக்குறி → பெருக்கல் / வகுத்தல் → கூட்டல் / கழித்தல்.</div>`,
percentage:`<h3>📊 Percentage</h3><p>Percentage என்பது நூற்றில் ஒரு பகுதியைக் குறிக்கும்.</p><div class="example">10% = 10/100</div><div class="example">200-ன் 10% = 20</div>`,

hcf:`<h3>🔢 HCF / LCM</h3><p><b>HCF</b> – மிகப்பெரிய பொது காரணி.</p><p><b>LCM</b> – மீச்சிறு பொது மடங்கு.</p>`,

area:`<h3>📐 Area</h3><ul><li>செவ்வகம் = நீளம் × அகலம்</li><li>சதுரம் = பக்கம் × பக்கம்</li><li>முக்கோணம் = 1/2 × அடிப்பக்கம் × உயரம்</li><li>வட்டம் = πr²</li></ul>`,
volume:`<h3>📦 Volume</h3><ul><li>கனசதுரம் = a³</li><li>கனசெவ்வகம் = நீளம் × அகலம் × உயரம்</li><li>உருளை = πr²h</li></ul>`,
timeWork:`<h3>⏱️ Time & Work</h3><div class="example">ஒருவர் ஒரு வேலையை n நாட்களில் முடித்தால், ஒரு நாளின் வேலை = 1/n</div>`,

profitLoss:`<h3>💰 Profit & Loss</h3><p>விற்பனை விலை > அடக்க விலை என்றால் லாபம்.</p><p>விற்பனை விலை < அடக்க விலை என்றால் நஷ்டம்.</p>`,

{q:"'உதவி' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["அவன் ஏழைக்கு உதவி செய்தான்.","உதவி ஒரு மலை.","உதவி சிவப்பு நிறம்.","உதவி தூங்கியது."],c:0,e:"உதவி என்பது ஒருவருக்கு துணையாக இருப்பதைக் குறிக்கும்."},
{q:"'சுத்தம்' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["வீட்டை சுத்தமாக வைத்திருக்க வேண்டும்.","சுத்தம் ஓடினான்.","சுத்தம் ஒரு மனிதன்.","சுத்தம் பாடியது."],c:0,e:"சுத்தம் என்பது தூய்மையைக் குறிக்கும்."},
{q:"'அறிவு' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["அறிவு ஒரு நாற்காலி.","அறிவு வாழ்க்கையில் மிகவும் முக்கியமானது.","அறிவு ஓடியது.","அறிவு சாப்பிட்டது."],c:1,e:"அறிவு என்பது தெரிந்து கொள்ளும் திறனைக் குறிக்கும்."},
{q:"'ஒழுக்கம்' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["மாணவர்கள் ஒழுக்கத்துடன் நடக்க வேண்டும்.","ஒழுக்கம் ஒரு பழம்.","ஒழுக்கம் ஓடியது.","ஒழுக்கம் குடித்தது."],c:0,e:"ஒழுக்கம் என்பது நல்ல நடத்தையைக் குறிக்கும்."},

{q:"'பாதுகாப்பு' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["சாலை பாதுகாப்பு அனைவருக்கும் அவசியம்.","பாதுகாப்பு ஒரு பறவை.","பாதுகாப்பு சாப்பிட்டது.","பாதுகாப்பு ஓடியது."],c:0,e:"பாதுகாப்பு என்பது ஆபத்திலிருந்து காப்பதைக் குறிக்கும்."},
{q:"'நேர்மை' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["அவன் நேர்மையுடன் பேசினான்.","நேர்மை ஒரு வீடு.","நேர்மை ஓடியது.","நேர்மை இனிப்பாக இருந்தது."],c:0,e:"நேர்மை என்பது உண்மையாகவும் நியாயமாகவும் நடப்பதைக் குறிக்கும்."},
{q:"'கல்வி' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["கல்வி வாழ்க்கையை உயர்த்துகிறது.","கல்வி ஓடுகிறது.","கல்வி சாப்பிட்டது.","கல்வி ஒரு மரம்."],c:0,e:"கல்வி மனிதனின் அறிவை வளர்க்கிறது."},
{q:"'நட்பு' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["நல்ல நட்பு வாழ்க்கைக்கு துணையாகும்.","நட்பு ஒரு கல்.","நட்பு சாப்பிட்டது.","நட்பு ஓடியது."],c:0,e:"நட்பு என்பது நண்பர்களுக்கிடையிலான அன்பான உறவு."},
{q:"'பொறுப்பு' என்ற சொல்லின் சரியான பயன்பாடு எது?",a:["அவன் தனது பொறுப்பை சரியாக நிறைவேற்றினான்.","பொறுப்பு ஒரு பழம்.","பொறுப்பு ஓடியது.","பொறுப்பு நீலமானது."],c:0,e:"பொறுப்பு என்பது செய்ய வேண்டிய கடமையைக் குறிக்கும்."},

{q:"'கற்றது கைமண் அளவு, கல்லாதது உலகளவு' என்ற பழமொழியின் பொருள் என்ன?",a:["கற்றது மட்டுமே போதும்","கற்றது சிறிது; கற்க வேண்டியது மிக அதிகம்","உலகம் சிறியது","மண் மிகவும் பெரியது"],c:1,e:"நாம் கற்றது சிறிது; கற்க வேண்டியது மிக அதிகம்."},
{q:"'காக்கைக்கும் தன் குஞ்சு பொன் குஞ்சு' என்பதன் பொருள் என்ன?",a:["காக்கை பொன்னால் ஆனது","ஒவ்வொருவருக்கும் தங்கள் பிள்ளைகள் சிறந்தவர்கள்","குஞ்சுகள் பொன்னாக இருக்கும்","காக்கை நல்ல பறவை"],c:1,e:"ஒவ்வொருவருக்கும் தங்கள் பிள்ளைகள் சிறந்தவர்களாகத் தோன்றுவர்."},
{q:"'அளவுக்கு மிஞ்சினால் அமிர்தமும் நஞ்சு' என்பதன் பொருள் என்ன?",a:["அமிர்தம் நஞ்சாகும்","எதையும் அளவோடு பயன்படுத்த வேண்டும்","நஞ்சு இனிப்பானது","அளவு தேவையில்லை"],c:1,e:"அளவுக்கு மீறிய எதுவும் தீங்கு தரும்."},
{q:"'ஒன்றுபட்டால் உண்டு வாழ்வு' என்பதன் பொருள் என்ன?",a:["தனியாக வாழ வேண்டும்","ஒற்றுமையுடன் இருந்தால் நன்மை உண்டு","வாழ்வு இல்லை","ஒன்றாக உணவு உண்ண வேண்டும்"],c:1,e:"ஒற்றுமையாக இருந்தால் பல நன்மைகள் கிடைக்கும்."},
{q:"'சிறு துளி பெரு வெள்ளம்' என்பதன் பொருள் என்ன?",a:["சிறிய முயற்சிகள் சேர்ந்து பெரிய பலனைத் தரும்","மழை மட்டும் பெய்யும்","வெள்ளம் சிறியது","துளி பயனற்றது"],c:0,e:"சிறிய அளவுகள் சேர்ந்து பெரிய அளவாகும்."},

{q:"'விதைத்தவன் அறுப்பான்' என்பதன் பொருள் என்ன?",a:["விதை மட்டும் வளராது","செயலுக்கு ஏற்ற பலன் கிடைக்கும்","விவசாயம் தேவையில்லை","அறுவடை செய்யக்கூடாது"],c:1,e:"ஒருவர் செய்யும் செயலுக்கேற்ப அதன் பலனைப் பெறுவார்."},
{q:"'நன்றி மறப்பது நன்றன்று' என்பதன் பொருள் என்ன?",a:["நன்றியை மறக்கக் கூடாது","நன்றி தேவையில்லை","மறப்பது நல்லது","நன்றி சொல்லக்கூடாது"],c:0,e:"செய்த உதவியை மறக்காமல் நன்றியுடன் இருக்க வேண்டும்."},
{q:"'குற்றம் பார்க்கின் சுற்றம் இல்லை' என்பதன் பொருள் என்ன?",a:["குற்றம் செய்வது நல்லது","எல்லோரிடமும் குறை பார்த்தால் உறவு நிலைக்காது","சுற்றம் தேவையில்லை","குற்றம் பார்க்க வேண்டும்"],c:1,e:"எப்போதும் குறைகளைப் பார்த்துக் கொண்டிருந்தால் உறவுகள் பாதிக்கப்படும்."},
{q:"'முயற்சி திருவினையாக்கும்' என்பதன் பொருள் என்ன?",a:["முயற்சி வெற்றியைத் தரும்","முயற்சி தோல்வியைத் தரும்","முயற்சி தேவையில்லை","திருவினை என்பது விளையாட்டு"],c:0,e:"தொடர்ந்து செய்யும் முயற்சி வெற்றியைத் தரும்."},
{q:"'காலம் பொன்னானது' என்பதன் பொருள் என்ன?",a:["காலம் பொன்னால் ஆனது","நேரம் மிகவும் மதிப்புமிக்கது","பொன் தேவையில்லை","காலம் மெதுவாக செல்லும்"],c:1,e:"நேரம் மிகவும் மதிப்புமிக்கது; அதை வீணாக்கக் கூடாது."},

{q:"'கண்ணில் மண் தூவுதல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["மண் போடுதல்","ஏமாற்றுதல்","கண்ணை மூடுதல்","விளையாடுதல்"],c:1,e:"கண்ணில் மண் தூவுதல் = ஏமாற்றுதல்."},
{q:"'கையை விரித்தல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["உதவி கேட்பது","கையை மூடுவது","ஓடுவது","தூங்குவது"],c:0,e:"கையை விரித்தல் என்பது உதவி அல்லது பொருள் கேட்பதைக் குறிக்கும்."},
{q:"'கண் திறத்தல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["தூங்குதல்","உண்மையை உணர்தல்","கண் மூடுதல்","அழுதல்"],c:1,e:"கண் திறத்தல் என்பது உண்மையை உணர்தல்."},
{q:"'காது கொடுத்துக் கேட்பது' என்பதன் பொருள் என்ன?",a:["கவனமாகக் கேட்பது","காதை மூடுவது","ஓடுவது","பேசாமல் இருப்பது"],c:0,e:"காது கொடுத்துக் கேட்பது = கவனமாகக் கேட்பது."},
{q:"'மூக்கில் வியர்வை' என்ற சொற்றொடர் குறிக்கும் பொருள் என்ன?",a:["மிகவும் பாடுபடுதல்","தூங்குதல்","சிரித்தல்","விளையாடுதல்"],c:0,e:"மூக்கில் வியர்வை என்பது மிகவும் பாடுபடுவதைக் குறிக்கும்."},

{q:"'தலையில் தூக்கி வைத்துக் கொண்டாடுதல்' என்பதன் பொருள் என்ன?",a:["மிகவும் மதித்துப் போற்றுதல்","தலையில் பொருள் வைப்பது","தூங்குதல்","கோபப்படுதல்"],c:0,e:"ஒருவரை மிகவும் மதித்துப் போற்றுதல்."},
{q:"'கை கொடுத்தல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["உதவி செய்தல்","கையை மறைத்தல்","ஓடுதல்","தூங்குதல்"],c:0,e:"கை கொடுத்தல் = உதவி செய்தல்."},
{q:"'வாயில் மண் போடுதல்' என்பதன் பொருள் என்ன?",a:["பேசுதல்","பேச முடியாத நிலையை ஏற்படுத்துதல்","உணவு உண்ணுதல்","சிரித்தல்"],c:1,e:"வாயில் மண் போடுதல் என்பது பேச முடியாத நிலையை ஏற்படுத்துவதைக் குறிக்கும்."},
{q:"'கை மேல் பலன்' என்பதன் பொருள் என்ன?",a:["உடனடியாகப் பலன் கிடைத்தல்","கை வலித்தல்","பலன் கிடைக்காமல் போதல்","கையை உயர்த்துதல்"],c:0,e:"கை மேல் பலன் என்பது உடனடியாகப் பலன் கிடைப்பதைக் குறிக்கும்."},
{q:"'மனம் திறந்து பேசுதல்' என்பதன் பொருள் என்ன?",a:["உள்ளதை வெளிப்படையாகப் பேசுதல்","மௌனமாக இருத்தல்","கோபப்படுதல்","தூங்குதல்"],c:0,e:"மனம் திறந்து பேசுதல் = உள்ளதை வெளிப்படையாகப் பேசுதல்."},

{q:"'முதுகு காட்டுதல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["எதிர்த்து நிற்றல்","பின்வாங்குதல்","ஓடாமல் நிற்றல்","உதவி செய்தல்"],c:1,e:"முதுகு காட்டுதல் = போராட்டம் அல்லது முயற்சியில் இருந்து பின்வாங்குதல்."},
{q:"'தண்ணீர் காட்டுதல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["தண்ணீர் கொடுத்தல்","திணறச் செய்தல்","குளித்தல்","தாகம் தீர்த்தல்"],c:1,e:"தண்ணீர் காட்டுதல் என்பது ஒருவரைத் திணறச் செய்வதைக் குறிக்கும்."},
{q:"'கண்ணில் எண்ணெய் ஊற்றிக் காத்தல்' என்பதன் பொருள் என்ன?",a:["மிகுந்த கவனத்துடன் காத்திருத்தல்","தூங்குதல்","கண் மூடுதல்","அழுதல்"],c:0,e:"மிகுந்த கவனத்துடன் காத்திருத்தல்."},
{q:"'வானத்தைத் தொடுதல்' என்பதன் பொருள் என்ன?",a:["மிக உயர்ந்த நிலையை அடைதல்","வானில் பறத்தல்","மழை பெய்தல்","கீழே விழுதல்"],c:0,e:"வானத்தைத் தொடுதல் = மிக உயர்ந்த நிலையை அடைதல்."},
{q:"'கல்லில் நார் உரித்தல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["எளிதான செயல்","மிகவும் கடினமான செயல்","கல் உடைத்தல்","நார் தயாரித்தல்"],c:1,e:"கல்லில் நார் உரித்தல் என்பது மிகவும் கடினமான செயலைக் குறிக்கும்."},

{q:"'பல்லைக் காட்டுதல்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["சிரித்தல் மட்டும்","எதிர்த்து நிற்றல்","உணவு உண்ணுதல்","தூங்குதல்"],c:1,e:"பல்லைக் காட்டுதல் என்பது எதிர்த்து நிற்பதைக் குறிக்கும்."},
{q:"'தலைக்கனம்' என்ற சொற்றொடரின் பொருள் என்ன?",a:["அடக்கம்","அகந்தை","பொறுமை","அன்பு"],c:1,e:"தலைக்கனம் = அகந்தை."},
{q:"'கையைச் சுட்டுக் கொண்டான்' என்பதன் பொருள் என்ன?",a:["அனுபவத்தால் பாடம் கற்றுக்கொண்டான்","கையை கழுவினான்","கையை மறைத்தான்","விளையாடினான்"],c:0,e:"தன் செயலால் ஏற்பட்ட அனுபவத்தின் மூலம் பாடம் கற்றுக்கொண்டான்."},
{q:"'வாய் மூடி இருத்தல்' என்பதன் பொருள் என்ன?",a:["அமைதியாக இருத்தல்","அதிகமாகப் பேசுதல்","சிரித்தல்","பாடுதல்"],c:0,e:"வாய் மூடி இருத்தல் = அமைதியாக இருத்தல்."},
{q:"'மனம் உடைதல்' என்பதன் பொருள் என்ன?",a:["மகிழ்ச்சி அடைதல்","வருத்தமடைதல்","கோபப்படுதல்","வெற்றி பெறுதல்"],c:1,e:"மனம் உடைதல் = மிகவும் வருத்தமடைதல்."},

{q:"'கற்றது கைமண் அளவு' என்ற பழமொழி எதை உணர்த்துகிறது?",a:["அறிவு அளவற்றது","மண் அதிகம்","கற்றல் தேவையில்லை","உலகம் சிறியது"],c:0,e:"மனிதன் கற்ற அறிவு சிறிது; கற்க வேண்டியது அளவற்றது."},
{q:"'சிறு துளி பெரு வெள்ளம்' எதை உணர்த்துகிறது?",a:["சிறிய சேமிப்பும் பெரிய பயன் தரும்","தண்ணீர் வீணாக்க வேண்டும்","வெள்ளம் வராது","சிறியது பயனற்றது"],c:0,e:"சிறிய அளவுகள் சேர்ந்து பெரிய பலனைத் தரும்."},
{q:"'ஒன்றுபட்டால் உண்டு வாழ்வு' எதை வலியுறுத்துகிறது?",a:["பிரிவு","ஒற்றுமை","கோபம்","தனிமை"],c:1,e:"இந்தப் பழமொழி ஒற்றுமையின் முக்கியத்துவத்தை வலியுறுத்துகிறது."},
{q:"'அளவுக்கு மிஞ்சினால் அமிர்தமும் நஞ்சு' எதை வலியுறுத்துகிறது?",a:["அளவோடு செயல்படுதல்","அதிகமாகச் செய்தல்","எதையும் செய்யாமல் இருப்பது","நஞ்சை அருந்துதல்"],c:0,e:"எதையும் அளவோடு செய்வதே நல்லது."},
{q:"'முயற்சி திருவினையாக்கும்' என்பதன் முக்கிய கருத்து என்ன?",a:["முயற்சி வெற்றிக்கு வழிவகுக்கும்","முயற்சி தோல்வியைத் தரும்","முயற்சி தேவையில்லை","வெற்றி எளிதில் கிடைக்கும்"],c:0,e:"தொடர்ச்சியான முயற்சி வெற்றியைத் தரும்."}

reading:[
{q:"பத்தி: மரங்கள் மனிதர்களுக்கு மிகவும் பயனுள்ளவை. அவை நமக்கு நிழலையும் பழங்களையும் தருகின்றன. மேலும், காற்றை தூய்மைப்படுத்த உதவுகின்றன. நாம் மரங்களை பாதுகாக்க வேண்டும்.\n\nமரங்கள் மனிதர்களுக்கு எவ்வாறு பயனுள்ளதாக உள்ளன?",a:["நிழல் மற்றும் பழங்களைத் தருகின்றன","மழையை நிறுத்துகின்றன","வெப்பத்தை அதிகரிக்கின்றன","நீரை அழிக்கின்றன"],c:0,e:"பத்தியில் மரங்கள் நிழலும் பழங்களும் தருவதாகக் கூறப்பட்டுள்ளது."},
{q:"மேலுள்ள பத்தியின் அடிப்படையில் நாம் எதைப் பாதுகாக்க வேண்டும்?",a:["காற்றை மட்டும்","மரங்களை","பழங்களை மட்டும்","நிழலை மட்டும்"],c:1,e:"நாம் மரங்களைப் பாதுகாக்க வேண்டும் என்று பத்தியில் கூறப்பட்டுள்ளது."},
{q:"மேலுள்ள பத்தியின் முக்கியக் கருத்து என்ன?",a:["மரங்களை வெட்டுதல்","மரங்களின் பயனும் பாதுகாப்பின் அவசியமும்","பழங்களின் பயன் மட்டும்","காற்றின் தன்மை"],c:1,e:"பத்தியின் மையக் கருத்து மரங்களின் பயனையும் அவற்றைப் பாதுகாக்க வேண்டிய அவசியத்தையும் கூறுவதாகும்."},
{q:"பத்தி: குமார் தினமும் அதிகாலையில் எழுந்து உடற்பயிற்சி செய்கிறான். பின்னர் குளித்து காலை உணவை உண்டு பள்ளிக்குச் செல்கிறான். அவன் தனது நேரத்தை சரியாகப் பயன்படுத்துகிறான்.\n\nகுமார் எப்போது எழுகிறான்?",a:["நள்ளிரவில்","மதியம்","அதிகாலையில்","மாலையில்"],c:2,e:"குமார் தினமும் அதிகாலையில் எழுகிறான்."},
{q:"குமார் பள்ளிக்குச் செல்வதற்கு முன் என்ன செய்கிறான்?",a:["விளையாடுகிறான்","உடற்பயிற்சி செய்கிறான்","தூங்குகிறான்","புத்தகம் வாங்குகிறான்"],c:1,e:"அதிகாலையில் எழுந்து உடற்பயிற்சி செய்த பின்னர் பள்ளிக்குச் செல்கிறான்."},
{q:"குமாரின் சிறப்பு என்ன?",a:["நேரத்தை வீணாக்குகிறான்","நேரத்தை சரியாகப் பயன்படுத்துகிறான்","தினமும் தாமதமாக எழுகிறான்","பள்ளிக்குச் செல்வதில்லை"],c:1,e:"அவன் தனது நேரத்தை சரியாகப் பயன்படுத்துகிறான்."},
{q:"பத்தி: மழை விவசாயத்திற்கு மிகவும் அவசியமானது. மழை பெய்வதால் நிலத்தில் நீர் கிடைக்கிறது. பயிர்கள் நன்றாக வளர்கின்றன. எனவே, மழை விவசாயிகளுக்கு மிகவும் முக்கியமானது.\n\nமழை எதற்கு மிகவும் அவசியமானது?",a:["விளையாட்டிற்கு","விவசாயத்திற்கு","பயணத்திற்கு","கட்டிடத்திற்கு"],c:1,e:"மழை விவசாயத்திற்கு மிகவும் அவசியமானது."},
{q:"மழை பெய்வதால் என்ன கிடைக்கிறது?",a:["நிலத்தில் நீர்","புதிய வீடு","சாலை","புத்தகம்"],c:0,e:"மழை பெய்வதால் நிலத்தில் நீர் கிடைக்கிறது."},
{q:"பத்தியின் பொருத்தமான தலைப்பு எது?",a:["விவசாயத்தில் மழையின் முக்கியத்துவம்","விளையாட்டின் பயன்","சாலையின் முக்கியத்துவம்","கட்டிட வேலை"],c:0,e:"பத்தி விவசாயத்திற்கு மழை எவ்வளவு முக்கியம் என்பதை விளக்குகிறது."},
{q:"பத்தி: நூலகம் அறிவைப் பெறுவதற்கான சிறந்த இடமாகும். அங்கு பல்வேறு வகையான புத்தகங்கள் உள்ளன. மாணவர்கள் நூலகத்திற்குச் சென்று புத்தகங்களைப் படித்து தங்கள் அறிவை வளர்த்துக் கொள்ளலாம்.\n\nநூலகம் எதற்கான சிறந்த இடம்?",a:["விளையாடுவதற்கு","அறிவைப் பெறுவதற்கு","தூங்குவதற்கு","உணவு சமைப்பதற்கு"],c:1,e:"நூலகம் அறிவைப் பெறுவதற்கான சிறந்த இடம்."},
{q:"நூலகத்தில் என்ன உள்ளன?",a:["விளையாட்டுப் பொருட்கள் மட்டும்","பல்வேறு வகையான புத்தகங்கள்","உணவுகள்","துணிகள்"],c:1,e:"நூலகத்தில் பல்வேறு வகையான புத்தகங்கள் உள்ளன."},
{q:"மாணவர்கள் நூலகத்திற்குச் சென்று என்ன செய்யலாம்?",a:["புத்தகங்களைப் படித்து அறிவை வளர்த்துக் கொள்ளலாம்","விளையாடலாம்","தூங்கலாம்","சந்தைக்கு செல்லலாம்"],c:0,e:"புத்தகங்களைப் படித்து அறிவை வளர்த்துக் கொள்ளலாம்."},
{q:"பத்தி: சுத்தமான நீர் மனிதர்களின் ஆரோக்கியத்திற்கு அவசியமானது. நீரைப் பயன்படுத்துவதற்கு முன் அது தூய்மையாக உள்ளதா என்பதை உறுதி செய்ய வேண்டும். அசுத்தமான நீரைப் பருகுவதால் நோய்கள் ஏற்படலாம்.\n\nஎதற்கு சுத்தமான நீர் அவசியம்?",a:["ஆரோக்கியத்திற்கு","விளையாட்டிற்கு","பயணத்திற்கு","வீட்டிற்கு மட்டும்"],c:0,e:"சுத்தமான நீர் மனிதர்களின் ஆரோக்கியத்திற்கு அவசியமானது."},
{q:"அசுத்தமான நீரைப் பருகுவதால் என்ன ஏற்படலாம்?",a:["ஆரோக்கியம் அதிகரிக்கும்","நோய்கள் ஏற்படலாம்","பசி குறையும்","தூக்கம் வராது"],c:1,e:"அசுத்தமான நீரைப் பருகுவதால் நோய்கள் ஏற்படலாம்."},
{q:"நீரைப் பயன்படுத்துவதற்கு முன் எதை உறுதி செய்ய வேண்டும்?",a:["அது சூடாக உள்ளதா","அது தூய்மையாக உள்ளதா","அது இனிப்பாக உள்ளதா","அது நிறமுள்ளதாக உள்ளதா"],c:1,e:"நீர் தூய்மையாக உள்ளதா என்பதை உறுதி செய்ய வேண்டும்."},
{q:"பத்தி: நேரம் மிகவும் மதிப்புமிக்கது. கடந்த காலத்தை மீண்டும் கொண்டு வர முடியாது. எனவே, ஒவ்வொருவரும் தமக்குக் கிடைக்கும் நேரத்தை வீணாக்காமல் பயனுள்ளதாகப் பயன்படுத்த வேண்டும்.\n\nஎது மிகவும் மதிப்புமிக்கது?",a:["பணம்","நேரம்","பொருள்","விளையாட்டு"],c:1,e:"பத்தியில் நேரம் மிகவும் மதிப்புமிக்கது என்று கூறப்பட்டுள்ளது."},
{q:"கடந்த காலத்தை என்ன செய்ய முடியாது?",a:["மாற்ற முடியாது","மீண்டும் கொண்டு வர முடியாது","நினைக்க முடியாது","படிக்க முடியாது"],c:1,e:"கடந்த காலத்தை மீண்டும் கொண்டு வர முடியாது."},
{q:"நேரத்தை எவ்வாறு பயன்படுத்த வேண்டும்?",a:["வீணாக்க வேண்டும்","பயனுள்ளதாகப் பயன்படுத்த வேண்டும்","மறந்துவிட வேண்டும்","தாமதப்படுத்த வேண்டும்"],c:1,e:"கிடைக்கும் நேரத்தை வீணாக்காமல் பயனுள்ளதாகப் பயன்படுத்த வேண்டும்."},
{q:"பத்தி: புத்தகம் மனிதனின் சிறந்த நண்பன் என்று கூறப்படுகிறது. நல்ல புத்தகங்களைப் படிப்பதால் அறிவும் சிந்திக்கும் திறனும் வளர்கின்றன. எனவே, அனைவரும் நல்ல நூல்களை வாசிக்கும் பழக்கத்தை வளர்த்துக் கொள்ள வேண்டும்.\n\nமனிதனின் சிறந்த நண்பன் எனப்படுவது எது?",a:["பணம்","புத்தகம்","விளையாட்டு","பயணம்"],c:1,e:"புத்தகம் மனிதனின் சிறந்த நண்பன் என்று பத்தியில் கூறப்பட்டுள்ளது."},
{q:"நல்ல புத்தகங்களைப் படிப்பதால் என்ன வளர்கிறது?",a:["உடல் எடை","அறிவும் சிந்திக்கும் திறனும்","உயரம் மட்டும்","செல்வம் மட்டும்"],c:1,e:"நல்ல புத்தகங்கள் அறிவையும் சிந்திக்கும் திறனையும் வளர்க்கின்றன."},
{q:"பத்திக்கு ஏற்ற தலைப்பு எது?",a:["நல்ல நூல்களின் பயன்","விளையாட்டின் பயன்","பணத்தின் முக்கியத்துவம்","பயணத்தின் சிறப்பு"],c:0,e:"பத்தியின் முக்கிய கருத்து நல்ல நூல்களை வாசிப்பதன் பயன்."},
{q:"பத்தி: ஒற்றுமை ஒரு குடும்பத்திற்கும் நாட்டிற்கும் வலிமையைத் தருகிறது. குடும்ப உறுப்பினர்கள் ஒருவருக்கொருவர் உதவி செய்து அன்புடன் வாழ வேண்டும். ஒற்றுமையாக வாழும் இடத்தில் மகிழ்ச்சியும் அமைதியும் நிலவும்.\n\nஎது வலிமையைத் தருகிறது?",a:["பகைமை","ஒற்றுமை","சோம்பல்","கோபம்"],c:1,e:"ஒற்றுமை குடும்பத்திற்கும் நாட்டிற்கும் வலிமையைத் தருகிறது."},
{q:"குடும்ப உறுப்பினர்கள் எவ்வாறு வாழ வேண்டும்?",a:["சண்டையிட்டு","அன்புடன் உதவி செய்து","தனித்தனியாக","பகையுடன்"],c:1,e:"குடும்ப உறுப்பினர்கள் ஒருவருக்கொருவர் உதவி செய்து அன்புடன் வாழ வேண்டும்."},
{q:"ஒற்றுமையாக வாழும் இடத்தில் என்ன நிலவும்?",a:["பகைமை","அமைதியும் மகிழ்ச்சியும்","பயம்","குழப்பம்"],c:1,e:"ஒற்றுமையாக வாழும் இடத்தில் மகிழ்ச்சியும் அமைதியும் நிலவும்."},
{q:"பத்தி: உடற்பயிற்சி உடலையும் மனதையும் ஆரோக்கியமாக வைத்திருக்க உதவுகிறது. தினமும் சிறிது நேரம் நடைப்பயிற்சி செய்வது நல்ல பழக்கம். உடற்பயிற்சியுடன் சத்தான உணவும் அவசியம்.\n\nஉடற்பயிற்சி எவற்றை ஆரோக்கியமாக வைத்திருக்க உதவுகிறது?",a:["உடலை மட்டும்","மனதை மட்டும்","உடலையும் மனதையும்","வீட்டை"],c:2,e:"உடற்பயிற்சி உடலையும் மனதையும் ஆரோக்கியமாக வைத்திருக்க உதவுகிறது."},
{q:"தினமும் செய்ய நல்ல பழக்கம் எது?",a:["நடைப்பயிற்சி","நீண்ட நேரம் தூங்குதல்","உணவைத் தவிர்த்தல்","விளையாடாமல் இருப்பது"],c:0,e:"தினமும் சிறிது நேரம் நடைப்பயிற்சி செய்வது நல்ல பழக்கம்."},
{q:"உடற்பயிற்சியுடன் எது அவசியம்?",a:["சத்தான உணவு","அதிக இனிப்பு","தூக்கம் மட்டும்","தொலைக்காட்சி"],c:0,e:"உடற்பயிற்சியுடன் சத்தான உணவும் அவசியம்."},
{q:"பத்தி: மின்சாரம் நம் அன்றாட வாழ்க்கையில் முக்கிய பங்கு வகிக்கிறது. விளக்குகள், மின்விசிறிகள், கணினிகள் போன்ற பல சாதனங்கள் மின்சாரத்தால் இயங்குகின்றன. எனவே, மின்சாரத்தை வீணாக்காமல் சிக்கனமாகப் பயன்படுத்த வேண்டும்.\n\nமின்சாரம் எதில் முக்கிய பங்கு வகிக்கிறது?",a:["அன்றாட வாழ்க்கையில்","விளையாட்டில் மட்டும்","பயணத்தில் மட்டும்","விவசாயத்தில் மட்டும்"],c:0,e:"மின்சாரம் நம் அன்றாட வாழ்க்கையில் முக்கிய பங்கு வகிக்கிறது."},
{q:"கீழ்கண்டவற்றில் மின்சாரத்தால் இயங்குவது எது?",a:["மின்விசிறி","மரம்","புத்தகம்","பென்சில்"],c:0,e:"மின்விசிறி மின்சாரத்தால் இயங்கும் சாதனம்."},
{q:"மின்சாரத்தை எவ்வாறு பயன்படுத்த வேண்டும்?",a:["வீணாக்க வேண்டும்","சிக்கனமாகப் பயன்படுத்த வேண்டும்","எப்போதும் பயன்படுத்த வேண்டும்","பயன்படுத்தக்கூடாது"],c:1,e:"மின்சாரத்தை வீணாக்காமல் சிக்கனமாகப் பயன்படுத்த வேண்டும்."},
{q:"பத்தி: விவசாயி கடுமையாக உழைத்து உணவுப் பொருட்களை உற்பத்தி செய்கிறார். அவர் வெயில், மழை போன்றவற்றைப் பொருட்படுத்தாமல் வயலில் உழைக்கிறார். எனவே, விவசாயிகளின் உழைப்பை நாம் மதிக்க வேண்டும்.\n\nவிவசாயி என்ன செய்கிறார்?",a:["உணவுப் பொருட்களை உற்பத்தி செய்கிறார்","வீடுகளை கட்டுகிறார்","புத்தகங்களை எழுதுகிறார்","வாகனங்களை ஓட்டுகிறார்"],c:0,e:"விவசாயி உணவுப் பொருட்களை உற்பத்தி செய்கிறார்."},
{q:"விவசாயி எதைப் பொருட்படுத்தாமல் உழைக்கிறார்?",a:["பணம்","வெயிலும் மழையும்","நண்பர்கள்","பள்ளி"],c:1,e:"விவசாயி வெயில், மழை போன்றவற்றைப் பொருட்படுத்தாமல் உழைக்கிறார்."},
{q:"நாம் எதை மதிக்க வேண்டும்?",a:["விவசாயிகளின் உழைப்பை","மழையை மட்டும்","வயலை மட்டும்","உணவை மட்டும்"],c:0,e:"விவசாயிகளின் உழைப்பை நாம் மதிக்க வேண்டும்."},
{q:"பத்தி: பெற்றோர் தங்கள் குழந்தைகளின் நலனுக்காக பல தியாகங்களைச் செய்கிறார்கள். அவர்கள் குழந்தைகளுக்கு கல்வி, உணவு, உடை ஆகியவற்றை வழங்குகிறார்கள். எனவே, குழந்தைகள் பெற்றோர்களை மதித்து அன்புடன் நடத்த வேண்டும்.\n\nபெற்றோர் எதற்காக தியாகம் செய்கிறார்கள்?",a:["தங்கள் குழந்தைகளின் நலனுக்காக","பணத்திற்காக மட்டும்","பயணத்திற்காக","விளையாட்டிற்காக"],c:0,e:"பெற்றோர் குழந்தைகளின் நலனுக்காக பல தியாகங்களைச் செய்கிறார்கள்."},
{q:"பெற்றோர் குழந்தைகளுக்கு எதை வழங்குகிறார்கள்?",a:["கல்வி, உணவு, உடை","பணம் மட்டும்","விளையாட்டு மட்டும்","பயணம் மட்டும்"],c:0,e:"பத்தியில் கல்வி, உணவு, உடை வழங்குவதாகக் கூறப்பட்டுள்ளது."},
{q:"குழந்தைகள் பெற்றோர்களை எவ்வாறு நடத்த வேண்டும்?",a:["புறக்கணிக்க வேண்டும்","மதித்து அன்புடன் நடத்த வேண்டும்","கோபமாக நடத்த வேண்டும்","விட்டு செல்ல வேண்டும்"],c:1,e:"குழந்தைகள் பெற்றோர்களை மதித்து அன்புடன் நடத்த வேண்டும்."},
{q:"பத்தி: மழைநீர் சேகரிப்பு நீரைப் பாதுகாக்க உதவும் சிறந்த முறையாகும். வீடுகளின் கூரைகளில் விழும் மழைநீரைத் தொட்டிகளில் சேமிக்கலாம். இதனால் நிலத்தடி நீர்மட்டமும் உயர உதவும்.\n\nமழைநீர் சேகரிப்பு எதற்கு உதவுகிறது?",a:["நீரைப் பாதுகாக்க","நீரை வீணாக்க","மின்சாரத்தை உருவாக்க மட்டும்","மரங்களை வெட்ட"],c:0,e:"மழைநீர் சேகரிப்பு நீரைப் பாதுகாக்க உதவுகிறது."},
{q:"மழைநீரை எங்கு சேமிக்கலாம்?",a:["தொட்டிகளில்","சாலைகளில் மட்டும்","குப்பைத்தொட்டியில்","வகுப்பறையில்"],c:0,e:"மழைநீரைத் தொட்டிகளில் சேமிக்கலாம்."},
{q:"மழைநீர் சேகரிப்பால் எது உயர உதவும்?",a:["காற்றின் வேகம்","நிலத்தடி நீர்மட்டம்","வெப்பநிலை","மரங்களின் உயரம்"],c:1,e:"மழைநீர் சேகரிப்பு நிலத்தடி நீர்மட்டம் உயர உதவும்."},
{q:"பத்தி: சாலைப் பாதுகாப்பு அனைவரின் பொறுப்பாகும். வாகன ஓட்டிகள் போக்குவரத்து விதிகளைப் பின்பற்ற வேண்டும். பாதசாரிகள் சாலையைக் கடக்கும்போது குறிப்பிட்ட இடங்களைப் பயன்படுத்த வேண்டும். இதனால் விபத்துகளைத் தவிர்க்கலாம்.\n\nசாலைப் பாதுகாப்பு யாருடைய பொறுப்பு?",a:["வாகன ஓட்டிகளின் மட்டும்","பாதசாரிகளின் மட்டும்","அனைவரின்","காவலர்களின் மட்டும்"],c:2,e:"சாலைப் பாதுகாப்பு அனைவரின் பொறுப்பு என்று பத்தியில் கூறப்பட்டுள்ளது."},
{q:"வாகன ஓட்டிகள் எதைப் பின்பற்ற வேண்டும்?",a:["விளையாட்டு விதிகளை","போக்குவரத்து விதிகளை","பள்ளி விதிகளை","வீட்டு விதிகளை"],c:1,e:"வாகன ஓட்டிகள் போக்குவரத்து விதிகளைப் பின்பற்ற வேண்டும்."},
{q:"சாலையைக் கடக்கும்போது பாதசாரிகள் எதைப் பயன்படுத்த வேண்டும்?",a:["குறிப்பிட்ட இடங்களை","சாலையின் நடுப்பகுதியை","வாகனப் பாதையை","எங்கு வேண்டுமானாலும்"],c:0,e:"பாதசாரிகள் சாலையைக் கடக்கும்போது குறிப்பிட்ட இடங்களைப் பயன்படுத்த வேண்டும்."},
{q:"பத்தி: நேர்மை மனிதனின் சிறந்த பண்புகளில் ஒன்றாகும். உண்மையைப் பேசுபவரை மற்றவர்கள் நம்புவர். நேர்மையான வாழ்க்கை மன அமைதியைத் தரும். எனவே, அனைவரும் நேர்மையைப் பின்பற்ற வேண்டும்.\n\nநேர்மை எவ்வாறு குறிப்பிடப்படுகிறது?",a:["சிறந்த பண்புகளில் ஒன்று","பலவீனம்","தீய பழக்கம்","தேவையற்றது"],c:0,e:"நேர்மை மனிதனின் சிறந்த பண்புகளில் ஒன்றாகும்."},
{q:"உண்மையைப் பேசுபவரை மற்றவர்கள் என்ன செய்வார்கள்?",a:["வெறுப்பார்கள்","நம்புவர்","புறக்கணிப்பார்கள்","தண்டிப்பார்கள்"],c:1,e:"உண்மையைப் பேசுபவரை மற்றவர்கள் நம்புவர்."},
{q:"நேர்மையான வாழ்க்கை எதைத் தரும்?",a:["மன அமைதியை","பயத்தை","கோபத்தை","துன்பத்தை"],c:0,e:"நேர்மையான வாழ்க்கை மன அமைதியைத் தரும்."},
{q:"பத்தி: சுற்றுச்சூழலைப் பாதுகாப்பது ஒவ்வொருவரின் கடமையாகும். மரங்களை வளர்த்தல், குப்பைகளை முறையாக அகற்றுதல், பிளாஸ்டிக் பயன்பாட்டைக் குறைத்தல் போன்ற செயல்கள் சுற்றுச்சூழலைப் பாதுகாக்க உதவும்.\n\nசுற்றுச்சூழலைப் பாதுகாப்பது யாருடைய கடமை?",a:["அரசின் மட்டும்","மாணவர்களின் மட்டும்","ஒவ்வொருவரின்","விவசாயிகளின் மட்டும்"],c:2,e:"சுற்றுச்சூழலைப் பாதுகாப்பது ஒவ்வொருவரின் கடமை."},
{q:"கீழ்கண்டவற்றில் சுற்றுச்சூழலைப் பாதுகாக்க உதவும் செயல் எது?",a:["மரங்களை வளர்த்தல்","குப்பைகளை வீசுதல்","பிளாஸ்டிக்கை அதிகம் பயன்படுத்துதல்","மரங்களை வெட்டுதல்"],c:0,e:"மரங்களை வளர்ப்பது சுற்றுச்சூழலைப் பாதுகாக்க உதவும்."},
{q:"பிளாஸ்டிக் பயன்பாட்டைப் பற்றி பத்தி கூறுவது என்ன?",a:["அதிகரிக்க வேண்டும்","குறைக்க வேண்டும்","எப்போதும் பயன்படுத்த வேண்டும்","முற்றிலும் மறக்க வேண்டும்"],c:1,e:"பிளாஸ்டிக் பயன்பாட்டைக் குறைக்க வேண்டும் என்று பத்தியில் கூறப்பட்டுள்ளது."},
{q:"மேலுள்ள சுற்றுச்சூழல் பத்தியின் ஏற்ற தலைப்பு எது?",a:["சுற்றுச்சூழல் பாதுகாப்பு","விளையாட்டு","கல்வி","பயணம்"],c:0,e:"பத்தியின் மையக்கருத்து சுற்றுச்சூழலைப் பாதுகாப்பது."},
{q:"பத்தியைப் படித்து கேள்விக்குப் பதிலளிக்கவும்: \"நேரத்தை சரியாகப் பயன்படுத்துபவர்கள் தங்கள் பணிகளை திட்டமிட்டு செய்கிறார்கள். அவர்கள் நேரத்தை வீணாக்காமல், ஒவ்வொரு பணியையும் உரிய நேரத்தில் முடிக்க முயற்சி செய்கிறார்கள்.\" இவர்களின் முக்கியமான பண்பு எது?",a:["நேரத்தை வீணாக்குதல்","நேரத்தை சரியாகப் பயன்படுத்துதல்","வேலை செய்யாமல் இருத்தல்","தாமதமாக செயல்படுதல்"],c:1,e:"பத்தியில் அவர்கள் நேரத்தை வீணாக்காமல் சரியாகப் பயன்படுத்துகிறார்கள் என்று கூறப்பட்டுள்ளது."} 
],
literature:[
{q:"ஐம்பெருங்காப்பியங்களில் ஒன்று எது?",a:["சிலப்பதிகாரம்","திருக்குறள்","ஆத்திசூடி","பெரியபுராணம்"],c:0,e:"சிலப்பதிகாரம் ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"ஐம்பெருங்காப்பியங்களில் இடம்பெறும் நூல் எது?",a:["மணிமேகலை","திருவாசகம்","கம்பராமாயணம்","ஆத்திசூடி"],c:0,e:"மணிமேகலை ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"கீழ்கண்டவற்றில் ஐம்பெருங்காப்பியங்களில் ஒன்று எது?",a:["சீவக சிந்தாமணி","திருக்குறள்","பெரியபுராணம்","நாலடியார்"],c:0,e:"சீவக சிந்தாமணி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"ஐம்பெருங்காப்பியங்களில் இடம்பெறும் நூல் எது?",a:["வளையாபதி","ஆத்திசூடி","திருவாசகம்","கம்பராமாயணம்"],c:0,e:"வளையாபதி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"ஐம்பெருங்காப்பியங்களில் இடம்பெறும் நூல் எது?",a:["குண்டலகேசி","பெரியபுராணம்","திருக்குறள்","திருவாசகம்"],c:0,e:"குண்டலகேசி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"ஐம்பெருங்காப்பியங்கள் எத்தனை?",a:["மூன்று","நான்கு","ஐந்து","ஆறு"],c:2,e:"தமிழில் ஐம்பெருங்காப்பியங்கள் ஐந்து."},
{q:"கீழ்கண்டவற்றில் ஐம்பெருங்காப்பியங்களில் சேராதது எது?",a:["சிலப்பதிகாரம்","மணிமேகலை","திருக்குறள்","குண்டலகேசி"],c:2,e:"திருக்குறள் ஐம்பெருங்காப்பியங்களில் சேராது."},
{q:"கீழ்கண்டவற்றில் ஐம்பெருங்காப்பியங்களில் சேராதது எது?",a:["வளையாபதி","சீவக சிந்தாமணி","ஆத்திசூடி","மணிமேகலை"],c:2,e:"ஆத்திசூடி ஐம்பெருங்காப்பியங்களில் சேராது."},
{q:"'சிலப்பதிகாரம்' நூலின் ஆசிரியர் யார்?",a:["கம்பர்","இளங்கோ அடிகள்","சேக்கிழார்","திருவள்ளுவர்"],c:1,e:"சிலப்பதிகாரத்தை இயற்றியவர் இளங்கோ அடிகள்."},
{q:"'மணிமேகலை' நூலின் ஆசிரியர் யார்?",a:["சீத்தலைச் சாத்தனார்","இளங்கோ அடிகள்","கம்பர்","மாணிக்கவாசகர்"],c:0,e:"மணிமேகலையை இயற்றியவர் சீத்தலைச் சாத்தனார்."},

{q:"'ஆத்திசூடி' நூலுடன் தொடர்புடைய ஆசிரியர் யார்?",a:["அவ்வையார்","கம்பர்","சேக்கிழார்","திருவள்ளுவர்"],c:0,e:"ஆத்திசூடியுடன் தொடர்புடையவர் அவ்வையார்."},
{q:"இளங்கோ அடிகளுடன் தொடர்புடைய நூல் எது?",a:["சிலப்பதிகாரம்","மணிமேகலை","திருக்குறள்","திருவாசகம்"],c:0,e:"இளங்கோ அடிகள் – சிலப்பதிகாரம்."},
{q:"சீத்தலைச் சாத்தனாருடன் தொடர்புடைய நூல் எது?",a:["மணிமேகலை","சிலப்பதிகாரம்","பெரியபுராணம்","ஆத்திசூடி"],c:0,e:"சீத்தலைச் சாத்தனார் – மணிமேகலை."},
{q:"திருவள்ளுவருடன் தொடர்புடைய நூல் எது?",a:["திருக்குறள்","கம்பராமாயணம்","திருவாசகம்","சிலப்பதிகாரம்"],c:0,e:"திருவள்ளுவர் – திருக்குறள்."},
{q:"கம்பருடன் தொடர்புடைய நூல் எது?",a:["பெரியபுராணம்","கம்பராமாயணம்","திருக்குறள்","ஆத்திசூடி"],c:1,e:"கம்பர் – கம்பராமாயணம்."},
{q:"சேக்கிழாருடன் தொடர்புடைய நூல் எது?",a:["திருவாசகம்","பெரியபுராணம்","மணிமேகலை","சிலப்பதிகாரம்"],c:1,e:"சேக்கிழார் – பெரியபுராணம்."},

{q:"மாணிக்கவாசகருடன் தொடர்புடைய நூல் எது?",a:["திருவாசகம்","திருக்குறள்","ஆத்திசூடி","கம்பராமாயணம்"],c:0,e:"மாணிக்கவாசகர் – திருவாசகம்."},
{q:"அவ்வையாருடன் தொடர்புடைய நூல் எது?",a:["ஆத்திசூடி","பெரியபுராணம்","மணிமேகலை","திருவாசகம்"],c:0,e:"அவ்வையார் – ஆத்திசூடி."},
{q:"'சிலப்பதிகாரம்' யாரால் இயற்றப்பட்டது?",a:["கம்பர்","இளங்கோ அடிகள்","சீத்தலைச் சாத்தனார்","சேக்கிழார்"],c:1,e:"சிலப்பதிகாரம் – இளங்கோ அடிகள்."},

{q:"'திருக்குறள்' யாரால் இயற்றப்பட்டது?",a:["திருவள்ளுவர்","அவ்வையார்","சேக்கிழார்","கம்பர்"],c:0,e:"திருக்குறள் – திருவள்ளுவர்."},
{q:"'கம்பராமாயணம்' யாரால் இயற்றப்பட்டது?",a:["சேக்கிழார்","கம்பர்","திருவள்ளுவர்","இளங்கோ அடிகள்"],c:1,e:"கம்பராமாயணம் – கம்பர்."},
{q:"'பெரியபுராணம்' யாரால் இயற்றப்பட்டது?",a:["மாணிக்கவாசகர்","சேக்கிழார்","கம்பர்","அவ்வையார்"],c:1,e:"பெரியபுராணம் – சேக்கிழார்."},
{q:"'திருவாசகம்' யாரால் இயற்றப்பட்டது?",a:["மாணிக்கவாசகர்","திருவள்ளுவர்","சேக்கிழார்","கம்பர்"],c:0,e:"திருவாசகம் – மாணிக்கவாசகர்."},
{q:"'ஆத்திசூடி' யாருடன் தொடர்புடையது?",a:["அவ்வையார்","கம்பர்","திருவள்ளுவர்","சேக்கிழார்"],c:0,e:"ஆத்திசூடி – அவ்வையார்."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["திருவள்ளுவர் – சிலப்பதிகாரம்","இளங்கோ அடிகள் – சிலப்பதிகாரம்","கம்பர் – திருவாசகம்","சேக்கிழார் – ஆத்திசூடி"],c:1,e:"இளங்கோ அடிகள் – சிலப்பதிகாரம் என்பது சரியான இணை."},

{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["சீத்தலைச் சாத்தனார் – மணிமேகலை","கம்பர் – திருக்குறள்","மாணிக்கவாசகர் – பெரியபுராணம்","அவ்வையார் – கம்பராமாயணம்"],c:0,e:"சீத்தலைச் சாத்தனார் – மணிமேகலை என்பது சரியான இணை."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["திருவள்ளுவர் – திருக்குறள்","கம்பர் – திருவாசகம்","சேக்கிழார் – ஆத்திசூடி","அவ்வையார் – பெரியபுராணம்"],c:0,e:"திருவள்ளுவர் – திருக்குறள் என்பது சரியான இணை."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["கம்பர் – கம்பராமாயணம்","கம்பர் – திருக்குறள்","கம்பர் – ஆத்திசூடி","கம்பர் – திருவாசகம்"],c:0,e:"கம்பர் – கம்பராமாயணம் என்பது சரியான இணை."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["சேக்கிழார் – பெரியபுராணம்","சேக்கிழார் – திருக்குறள்","சேக்கிழார் – சிலப்பதிகாரம்","சேக்கிழார் – ஆத்திசூடி"],c:0,e:"சேக்கிழார் – பெரியபுராணம் என்பது சரியான இணை."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["மாணிக்கவாசகர் – திருவாசகம்","மாணிக்கவாசகர் – சிலப்பதிகாரம்","மாணிக்கவாசகர் – திருக்குறள்","மாணிக்கவாசகர் – ஆத்திசூடி"],c:0,e:"மாணிக்கவாசகர் – திருவாசகம் என்பது சரியான இணை."},
{q:"கீழ்கண்ட இணைகளில் சரியானது எது?",a:["அவ்வையார் – ஆத்திசூடி","அவ்வையார் – மணிமேகலை","அவ்வையார் – பெரியபுராணம்","அவ்வையார் – கம்பராமாயணம்"],c:0,e:"அவ்வையார் – ஆத்திசூடி என்பது சரியான இணை."},
{q:"கீழ்கண்டவற்றில் எந்த நூல் காப்பியம்?",a:["சிலப்பதிகாரம்","ஆத்திசூடி","திருக்குறள்","திருவாசகம்"],c:0,e:"சிலப்பதிகாரம் ஒரு பெருங்காப்பியம்."},
{q:"கீழ்கண்டவற்றில் எந்த நூல் ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்?",a:["மணிமேகலை","பெரியபுராணம்","திருவாசகம்","ஆத்திசூடி"],c:0,e:"மணிமேகலை ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"கீழ்கண்டவற்றில் எது ஐம்பெருங்காப்பியப் பட்டியலில் உள்ளது?",a:["குண்டலகேசி","திருக்குறள்","ஆத்திசூடி","திருவாசகம்"],c:0,e:"குண்டலகேசி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"'வளையாபதி' எந்தப் பட்டியலில் இடம்பெறுகிறது?",a:["ஐம்பெருங்காப்பியங்கள்","பதினெண்கீழ்க்கணக்கு","எட்டுத்தொகை","பத்துப்பாட்டு"],c:0,e:"வளையாபதி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},

{q:"'சீவக சிந்தாமணி' எந்தப் பட்டியலில் இடம்பெறுகிறது?",a:["ஐம்பெருங்காப்பியங்கள்","எட்டுத்தொகை","பத்துப்பாட்டு","பதினெண்கீழ்க்கணக்கு"],c:0,e:"சீவக சிந்தாமணி ஐம்பெருங்காப்பியங்களில் ஒன்றாகும்."},
{q:"கீழ்கண்டவற்றில் ஐம்பெருங்காப்பியங்களின் சரியான தொகுப்பு எது?",a:["சிலப்பதிகாரம், மணிமேகலை, சீவக சிந்தாமணி, வளையாபதி, குண்டலகேசி","திருக்குறள், ஆத்திசூடி, திருவாசகம், பெரியபுராணம், கம்பராமாயணம்","புறநானூறு, அகநானூறு, குறுந்தொகை, நற்றிணை, கலித்தொகை","திருமுருகாற்றுப்படை, பொருநராற்றுப்படை, பட்டினப்பாலை, மதுரைக்காஞ்சி, முல்லைப்பாட்டு"],c:0,e:"இந்த ஐந்து நூல்களே ஐம்பெருங்காப்பியங்கள்."},
{q:"கீழ்கண்டவற்றில் ஆசிரியர்–நூல் இணை தவறானது எது?",a:["திருவள்ளுவர் – திருக்குறள்","இளங்கோ அடிகள் – சிலப்பதிகாரம்","கம்பர் – கம்பராமாயணம்","சேக்கிழார் – ஆத்திசூடி"],c:3,e:"ஆத்திசூடி – அவ்வையார். சேக்கிழார் – பெரியபுராணம்."},
{q:"கீழ்கண்டவற்றில் ஆசிரியர்–நூல் இணை தவறானது எது?",a:["சீத்தலைச் சாத்தனார் – மணிமேகலை","மாணிக்கவாசகர் – திருவாசகம்","அவ்வையார் – ஆத்திசூடி","கம்பர் – பெரியபுராணம்"],c:3,e:"பெரியபுராணம் – சேக்கிழார்; கம்பர் – கம்பராமாயணம்."},
{q:"'திருவள்ளுவர்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["திருக்குறள்","சிலப்பதிகாரம்","மணிமேகலை","திருவாசகம்"],c:0,e:"திருவள்ளுவர் – திருக்குறள்."},
{q:"'இளங்கோ அடிகள்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["கம்பராமாயணம்","சிலப்பதிகாரம்","பெரியபுராணம்","ஆத்திசூடி"],c:1,e:"இளங்கோ அடிகள் – சிலப்பதிகாரம்."},
{q:"'சீத்தலைச் சாத்தனார்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["மணிமேகலை","திருக்குறள்","திருவாசகம்","பெரியபுராணம்"],c:0,e:"சீத்தலைச் சாத்தனார் – மணிமேகலை."},
{q:"'சேக்கிழார்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["பெரியபுராணம்","கம்பராமாயணம்","ஆத்திசூடி","திருக்குறள்"],c:0,e:"சேக்கிழார் – பெரியபுராணம்."},
{q:"'மாணிக்கவாசகர்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["திருவாசகம்","சிலப்பதிகாரம்","மணிமேகலை","திருக்குறள்"],c:0,e:"மாணிக்கவாசகர் – திருவாசகம்."},
{q:"'அவ்வையார்' என்ற ஆசிரியருடன் தொடர்புடைய நூல் எது?",a:["ஆத்திசூடி","பெரியபுராணம்","திருக்குறள்","கம்பராமாயணம்"],c:0,e:"அவ்வையார் – ஆத்திசூடி."}
],
scholars:[
{q:"தமிழ் அறிஞர்கள் என்பவர்கள் யார்?",a:["தமிழ்மொழியின் வளர்ச்சிக்காக பாடுபட்டவர்கள்","விளையாட்டு வீரர்கள்","வணிகர்கள்","அரசியல்வாதிகள்"],c:0,e:"தமிழ்மொழியின் வளர்ச்சிக்காக பாடுபட்ட முக்கிய அறிஞர்கள் தமிழ் அறிஞர்கள் எனப்படுவர்."},
{q:"தமிழ் வளர்ச்சிக்காக அறிஞர்கள் செய்த பணிகள் எவ்வாறு அழைக்கப்படுகின்றன?",a:["தமிழ்த்தொண்டு","சமூகப்பணி","வணிகப்பணி","கல்விப்பணி"],c:0,e:"தமிழ் வளர்ச்சிப் பணிகள் தமிழ்த்தொண்டு எனப்படும்."},
{q:"உ.வே.சாமிநாதையர் எவ்வாறு போற்றப்படுகிறார்?",a:["தமிழ்த்தாத்தா","மகாகவி","புரட்சிக்கவிஞர்","தமிழ்க்கடல்"],c:0,e:"உ.வே.சாமிநாதையர் 'தமிழ்த்தாத்தா' என்று போற்றப்படுகிறார்."},
{q:"உ.வே.சாமிநாதையர் செய்த முக்கிய தமிழ்த்தொண்டு எது?",a:["பழைய தமிழ் நூல்களைத் தேடி சேகரித்து பதிப்பித்தல்","தனித்தமிழ் இயக்கம்","சமூக சீர்திருத்தம் மட்டும்","அரசியல் பணி"],c:0,e:"அவர் ஓலைச்சுவடிகளில் இருந்த பழந்தமிழ் நூல்களைத் தேடி கண்டுபிடித்து பதிப்பித்தார்."},
{q:"உ.வே.சாமிநாதையர் எந்த வகையான நூல்களைத் தேடிக் கண்டுபிடித்தார்?",a:["பழந்தமிழ் நூல்கள்","ஆங்கில நூல்கள்","அறிவியல் நூல்கள்","வெளிநாட்டு நூல்கள்"],c:0,e:"அவர் பல பழந்தமிழ் நூல்களைத் தேடிக் கண்டுபிடித்தார்."},
{q:"பழந்தமிழ் நூல்கள் பெரும்பாலும் எதில் இருந்தன?",a:["ஓலைச்சுவடிகளில்","கணினிகளில்","செய்தித்தாள்களில்","தொலைக்காட்சியில்"],c:0,e:"பல பழந்தமிழ் நூல்கள் ஓலைச்சுவடிகளில் இருந்தன."},
{q:"உ.வே.சாமிநாதையர் ஓலைச்சுவடிகளில் இருந்த நூல்களை என்ன செய்தார்?",a:["அச்சிட்டு வெளியிட்டார்","அழித்தார்","மொழிபெயர்க்காமல் விட்டார்","மறைத்தார்"],c:0,e:"அவர் அவற்றைத் தேடி கண்டுபிடித்து அச்சிட்டு வெளியிட்டார்."},
{q:"'தமிழ்த்தாத்தா' என்று அழைக்கப்படுபவர் யார்?",a:["உ.வே.சாமிநாதையர்","பாரதியார்","பாரதிதாசன்","மறைமலை அடிகள்"],c:0,e:"உ.வே.சாமிநாதையர் தமிழ்த்தாத்தா என்று போற்றப்படுகிறார்."},
{q:"மறைமலை அடிகள் எந்த இயக்கத்துடன் தொடர்புடையவர்?",a:["தனித்தமிழ் இயக்கம்","விடுதலை இயக்கம்","சுற்றுச்சூழல் இயக்கம்","விவசாய இயக்கம்"],c:0,e:"மறைமலை அடிகள் தனித்தமிழ் இயக்கத்தை வளர்த்தார்."},
{q:"மறைமலை அடிகள் எவ்வாறு போற்றப்படுகிறார்?",a:["தனித்தமிழ் இயக்கத்தின் தந்தை","தமிழ்த்தாத்தா","மகாகவி","புரட்சிக்கவிஞர்"],c:0,e:"மறைமலை அடிகள் தனித்தமிழ் இயக்கத்தின் தந்தை என்று போற்றப்படுகிறார்."},

{q:"மறைமலை அடிகள் எதை வலியுறுத்தினார்?",a:["தனித்தமிழைப் பயன்படுத்துவதை","பிறமொழிச் சொற்களை அதிகம் பயன்படுத்துவதை","ஆங்கிலத்தை மட்டும் பயன்படுத்துவதை","தமிழைப் பயன்படுத்தாமல் இருப்பதை"],c:0,e:"தமிழில் பிறமொழிச் சொற்களின் கலப்பைக் குறைத்து தனித்தமிழைப் பயன்படுத்த வலியுறுத்தினார்."},
{q:"மறைமலை அடிகளின் நோக்கங்களில் ஒன்று எது?",a:["தமிழில் பிறமொழிக் கலப்பைக் குறைத்தல்","தமிழை மறத்தல்","ஆங்கிலத்தை வளர்த்தல்","தமிழ் நூல்களை அழித்தல்"],c:0,e:"அவர் தமிழில் பிறமொழிச் சொற்களின் கலப்பைக் குறைக்க முயன்றார்."},
{q:"மகாகவி என்று அழைக்கப்படுபவர் யார்?",a:["சுப்பிரமணிய பாரதியார்","பாரதிதாசன்","உ.வே.சாமிநாதையர்","மறைமலை அடிகள்"],c:0,e:"சுப்பிரமணிய பாரதியார் 'மகாகவி பாரதியார்' என்று அழைக்கப்படுகிறார்."},
{q:"பாரதியாரின் பாடல்களில் இடம்பெற்ற முக்கிய கருத்து எது?",a:["விடுதலை","வணிகம்","விவசாயம் மட்டும்","கணினி"],c:0,e:"பாரதியாரின் பாடல்களில் விடுதலை, சமத்துவம், பெண்கள் முன்னேற்றம் போன்ற கருத்துகள் இடம்பெற்றன."},
{q:"பாரதியார் எதைப் பற்றி பாடினார்?",a:["பெண்கள் முன்னேற்றம்","தமிழை மறப்பது","சாதியை ஆதரிப்பது","அறிவியலை எதிர்ப்பது"],c:0,e:"பெண்கள் முன்னேற்றத்தை பாரதியார் தனது பாடல்களில் வலியுறுத்தினார்."},
{q:"பாரதியார் எந்த கருத்தை எதிர்த்தார்?",a:["சாதி வேறுபாட்டை","சமத்துவத்தை","பெண்கள் முன்னேற்றத்தை","விடுதலையை"],c:0,e:"பாரதியாரின் பாடல்களில் சாதி எதிர்ப்புக் கருத்துகள் இடம்பெற்றன."},
{q:"பாரதியார் பாடல்களில் இடம்பெற்ற சமூகக் கருத்து எது?",a:["சமத்துவம்","பகைமை","அடிமைத்தனம்","சாதி வேறுபாடு"],c:0,e:"சமத்துவம் பாரதியாரின் முக்கிய கருத்துகளில் ஒன்றாகும்."},
{q:"பாரதியாரின் பாடல்களில் இடம்பெற்ற தேசப்பற்று சார்ந்த கருத்து எது?",a:["விடுதலை","அடிமைத்தனம்","பகைமை","சுயநலம்"],c:0,e:"பாரதியாரின் பாடல்களில் விடுதலை மற்றும் தேசப்பற்று முக்கியமாக இடம்பெற்றன."},
{q:"பாரதிதாசன் எவ்வாறு அழைக்கப்படுகிறார்?",a:["புரட்சிக்கவிஞர்","மகாகவி","தமிழ்த்தாத்தா","தமிழ்க்கடல்"],c:0,e:"பாரதிதாசன் 'புரட்சிக்கவிஞர்' என்று அழைக்கப்படுகிறார்."},
{q:"பாரதிதாசன் தனது படைப்புகளில் எதை வலியுறுத்தினார்?",a:["தமிழ் உணர்வு மற்றும் சமூக சீர்திருத்தம்","வணிகம் மட்டும்","விளையாட்டு மட்டும்","அறிவியல் மட்டும்"],c:0,e:"தமிழ் உணர்வு மற்றும் சமூக சீர்திருத்தக் கருத்துகளை வலியுறுத்தினார்."},

{q:"'புரட்சிக்கவிஞர்' என்ற சிறப்புப் பெயர் யாருக்கு உரியது?",a:["பாரதிதாசன்","பாரதியார்","உ.வே.சாமிநாதையர்","மறைமலை அடிகள்"],c:0,e:"பாரதிதாசன் புரட்சிக்கவிஞர் என்று அழைக்கப்படுகிறார்."},
{q:"பாரதிதாசனின் முக்கிய கருத்துகளில் ஒன்று எது?",a:["சமூக சீர்திருத்தம்","சாதி வேறுபாடு","அடிமைத்தனம்","தமிழ் எதிர்ப்பு"],c:0,e:"சமூக சீர்திருத்தம் பாரதிதாசனின் முக்கிய கருத்துகளில் ஒன்றாகும்."},
{q:"தேவநேயப் பாவாணர் எந்தத் துறையில் சிறப்புப் பங்களிப்பு செய்தார்?",a:["தமிழ்மொழி ஆய்வு","விளையாட்டு","வணிகம்","கணினி"],c:0,e:"தேவநேயப் பாவாணர் தமிழ்மொழி ஆய்வில் சிறப்புப் பங்களிப்பு செய்தார்."},
{q:"பெருஞ்சித்திரனார் எதை வளர்த்தார்?",a:["தனித்தமிழ் மற்றும் தமிழ் உணர்வு","விளையாட்டு","வணிகம்","ஆங்கில மொழி மட்டும்"],c:0,e:"பெருஞ்சித்திரனார் தனித்தமிழ் மற்றும் தமிழ் உணர்வை வளர்த்தார்."},
{q:"திரு.வி.க. என்பதன் விரிவாக்கம் என்ன?",a:["திரு.வி.கல்யாணசுந்தரனார்","திரு.வீரகாளியப்பன்","திரு.விநாயகசுந்தரம்","திரு.வேலாயுதம்"],c:0,e:"திரு.வி.க. என்பவர் திரு.வி.கல்யாணசுந்தரனார்."},
{q:"திரு.வி.கல்யாணசுந்தரனார் எந்தத் துறையில் பங்களித்தார்?",a:["தமிழ் உரைநடை மற்றும் சமூகப் பணி","விளையாட்டு","வணிகம்","கணினி"],c:0,e:"திரு.வி.கல்யாணசுந்தரனார் தமிழ் உரைநடை மற்றும் சமூகப் பணியில் பங்களித்தார்."},
{q:"மு.வ. என்பதன் விரிவாக்கம் என்ன?",a:["மு.வரதராசனார்","மு.வீரசாமி","மு.விநாயகம்","மு.வேலாயுதம்"],c:0,e:"மு.வ. என்பது மு.வரதராசனாரைக் குறிக்கும்."},
{q:"மு.வரதராசனார் எந்தத் துறைக்கு பங்களித்தார்?",a:["தமிழ் இலக்கியம் மற்றும் உரைநடை","விளையாட்டு","வணிகம்","மருத்துவம்"],c:0,e:"மு.வரதராசனார் தமிழ் இலக்கியம் மற்றும் உரைநடை வளர்ச்சிக்கு பங்களித்தார்."},
{q:"சி.வை.தாமோதரம் பிள்ளை செய்த முக்கிய பணி எது?",a:["பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தல்","தனித்தமிழ் இயக்கம்","பெண்கள் முன்னேற்றம்","சமூக சீர்திருத்தம் மட்டும்"],c:0,e:"சி.வை.தாமோதரம் பிள்ளை பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தார்."},
{q:"பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்த அறிஞர்களில் ஒருவர் யார்?",a:["சி.வை.தாமோதரம் பிள்ளை","பாரதிதாசன்","பெருஞ்சித்திரனார்","மறைமலை அடிகள்"],c:0,e:"சி.வை.தாமோதரம் பிள்ளை பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தார்."},

{q:"கீழ்கண்டவற்றில் சரியான இணை எது?",a:["உ.வே.சாமிநாதையர் – பழந்தமிழ் நூல்கள்","பாரதியார் – தனித்தமிழ் இயக்கம்","பாரதிதாசன் – தமிழ்த்தாத்தா","மறைமலை அடிகள் – மகாகவி"],c:0,e:"உ.வே.சாமிநாதையர் பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தார்."},
{q:"கீழ்கண்டவற்றில் சரியான இணை எது?",a:["மறைமலை அடிகள் – தனித்தமிழ் இயக்கம்","பாரதியார் – தமிழ்த்தாத்தா","பாரதிதாசன் – மகாகவி","உ.வே.சாமிநாதையர் – புரட்சிக்கவிஞர்"],c:0,e:"மறைமலை அடிகள் தனித்தமிழ் இயக்கத்தை வளர்த்தார்."},
{q:"கீழ்கண்டவற்றில் சரியான இணை எது?",a:["பாரதியார் – மகாகவி","பாரதிதாசன் – தமிழ்த்தாத்தா","உ.வே.சாமிநாதையர் – புரட்சிக்கவிஞர்","மறைமலை அடிகள் – மகாகவி"],c:0,e:"பாரதியார் மகாகவி என்று அழைக்கப்படுகிறார்."},
{q:"கீழ்கண்டவற்றில் சரியான இணை எது?",a:["பாரதிதாசன் – புரட்சிக்கவிஞர்","பாரதியார் – தமிழ்த்தாத்தா","மறைமலை அடிகள் – மகாகவி","உ.வே.சாமிநாதையர் – புரட்சிக்கவிஞர்"],c:0,e:"பாரதிதாசன் புரட்சிக்கவிஞர் என்று அழைக்கப்படுகிறார்."},
{q:"கீழ்கண்டவற்றில் தவறான இணை எது?",a:["உ.வே.சாமிநாதையர் – தமிழ்த்தாத்தா","பாரதியார் – மகாகவி","பாரதிதாசன் – புரட்சிக்கவிஞர்","மறைமலை அடிகள் – தமிழ்த்தாத்தா"],c:3,e:"தமிழ்த்தாத்தா என்பது உ.வே.சாமிநாதையரின் சிறப்புப் பெயர்."},
{q:"பாரதியார் எந்த மூன்று முக்கிய கருத்துகளைப் பாடினார்?",a:["விடுதலை, சமத்துவம், பெண்கள் முன்னேற்றம்","வணிகம், விளையாட்டு, மருத்துவம்","விவசாயம், தொழில், கணினி","பணம், பதவி, புகழ்"],c:0,e:"பாரதியார் விடுதலை, சமத்துவம், பெண்கள் முன்னேற்றம் போன்ற கருத்துகளைப் பாடினார்."},
{q:"தமிழில் பிறமொழிச் சொற்களின் கலப்பைக் குறைக்க வலியுறுத்தியவர் யார்?",a:["மறைமலை அடிகள்","பாரதியார்","உ.வே.சாமிநாதையர்","மு.வரதராசனார்"],c:0,e:"மறைமலை அடிகள் தனித்தமிழைப் பயன்படுத்த வலியுறுத்தினார்."},
{q:"ஓலைச்சுவடிகளில் இருந்த பழந்தமிழ் நூல்களைத் தேடி வெளியிட்டவர் யார்?",a:["உ.வே.சாமிநாதையர்","பாரதிதாசன்","பெருஞ்சித்திரனார்","திரு.வி.க."],c:0,e:"உ.வே.சாமிநாதையர் ஓலைச்சுவடிகளில் இருந்த பழந்தமிழ் நூல்களைத் தேடி அச்சிட்டு வெளியிட்டார்."},
{q:"தமிழ்மொழி ஆய்வில் சிறப்புப் பங்களிப்பு செய்தவர் யார்?",a:["தேவநேயப் பாவாணர்","கம்பர்","சேக்கிழார்","மாணிக்கவாசகர்"],c:0,e:"தேவநேயப் பாவாணர் தமிழ்மொழி ஆய்வில் சிறப்புப் பங்களிப்பு செய்தார்."},
{q:"தனித்தமிழ் மற்றும் தமிழ் உணர்வை வளர்த்தவர் யார்?",a:["பெருஞ்சித்திரனார்","கம்பர்","சேக்கிழார்","திருவள்ளுவர்"],c:0,e:"பெருஞ்சித்திரனார் தனித்தமிழ் மற்றும் தமிழ் உணர்வை வளர்த்தார்."},

{q:"தமிழ் உரைநடை மற்றும் சமூகப் பணியில் பங்களித்தவர் யார்?",a:["திரு.வி.கல்யாணசுந்தரனார்","தேவநேயப் பாவாணர்","பாரதியார்","பாரதிதாசன்"],c:0,e:"திரு.வி.கல்யாணசுந்தரனார் தமிழ் உரைநடை மற்றும் சமூகப் பணியில் பங்களித்தார்."},
{q:"தமிழ் இலக்கியம் மற்றும் உரைநடை வளர்ச்சிக்கு பங்களித்தவர் யார்?",a:["மு.வரதராசனார்","மறைமலை அடிகள்","சி.வை.தாமோதரம் பிள்ளை","பெருஞ்சித்திரனார்"],c:0,e:"மு.வரதராசனார் தமிழ் இலக்கியம் மற்றும் உரைநடை வளர்ச்சிக்கு பங்களித்தார்."},
{q:"பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தவர்களில் ஒருவர் யார்?",a:["உ.வே.சாமிநாதையர்","பாரதியார்","பாரதிதாசன்","தேவநேயப் பாவாணர்"],c:0,e:"உ.வே.சாமிநாதையர் பழந்தமிழ் நூல்களைத் தேடி பதிப்பித்தார்."},
{q:"'தமிழ்த்தொண்டு' என்பதன் பொருள் என்ன?",a:["தமிழ் வளர்ச்சிக்காக செய்யப்படும் பணி","வணிகம் செய்வது","விளையாடுவது","பயணம் செய்வது"],c:0,e:"தமிழ்மொழியின் வளர்ச்சிக்காக செய்யப்படும் பணிகள் தமிழ்த்தொண்டு எனப்படும்."},
{q:"விடுதலை, பெண்கள் முன்னேற்றம், சமத்துவம் ஆகியவற்றை வலியுறுத்தியவர் யார்?",a:["பாரதியார்","மறைமலை அடிகள்","உ.வே.சாமிநாதையர்","சி.வை.தாமோதரம் பிள்ளை"],c:0,e:"இந்த கருத்துகள் மகாகவி பாரதியாரின் பாடல்களில் இடம்பெற்றன."},
{q:"சமூக சீர்திருத்தம் மற்றும் தமிழ் உணர்வை வலியுறுத்தியவர் யார்?",a:["பாரதிதாசன்","பாரதியார்","உ.வே.சாமிநாதையர்","மு.வரதராசனார்"],c:0,e:"பாரதிதாசன் சமூக சீர்திருத்தம் மற்றும் தமிழ் உணர்வை வலியுறுத்தினார்."},
{q:"தனித்தமிழ் இயக்கத்தின் தந்தை என்று போற்றப்படுபவர் யார்?",a:["மறைமலை அடிகள்","உ.வே.சாமிநாதையர்","பாரதியார்","பாரதிதாசன்"],c:0,e:"மறைமலை அடிகள் தனித்தமிழ் இயக்கத்தின் தந்தை என்று போற்றப்படுகிறார்."},
{q:"'மகாகவி பாரதியார்' என்ற சிறப்புப் பெயர் யாரைக் குறிக்கிறது?",a:["சுப்பிரமணிய பாரதியார்","பாரதிதாசன்","உ.வே.சாமிநாதையர்","பெருஞ்சித்திரனார்"],c:0,e:"சுப்பிரமணிய பாரதியார் மகாகவி பாரதியார் என்று அழைக்கப்படுகிறார்."},
{q:"'புரட்சிக்கவிஞர்' என்ற சிறப்புப் பெயர் யாரைக் குறிக்கிறது?",a:["பாரதிதாசன்","பாரதியார்","மறைமலை அடிகள்","மு.வரதராசனார்"],c:0,e:"பாரதிதாசன் புரட்சிக்கவிஞர் என்று அழைக்கப்படுகிறார்."},
{q:"'தமிழ்த்தாத்தா' என்ற சிறப்புப் பெயர் யாரைக் குறிக்கிறது?",a:["உ.வே.சாமிநாதையர்","திரு.வி.கல்யாணசுந்தரனார்","தேவநேயப் பாவாணர்","சி.வை.தாமோதரம் பிள்ளை"],c:0,e:"உ.வே.சாமிநாதையர் தமிழ்த்தாத்தா என்று போற்றப்படுகிறார்."}
],
thirukkural:[
{q:"திருக்குறளை இயற்றியவர் யார்?",a:["திருவள்ளுவர்","கம்பர்","இளங்கோ அடிகள்","சேக்கிழார்"],c:0,e:"திருக்குறளை இயற்றியவர் திருவள்ளுவர்."},
{q:"திருக்குறளின் ஆசிரியர் யார்?",a:["பாரதியார்","திருவள்ளுவர்","அவ்வையார்","மாணிக்கவாசகர்"],c:1,e:"திருக்குறளின் ஆசிரியர் திருவள்ளுவர்."},
{q:"திருக்குறளில் மொத்தம் எத்தனை குறள்கள் உள்ளன?",a:["1300","1330","133","1000"],c:1,e:"திருக்குறளில் மொத்தம் 1330 குறள்கள் உள்ளன."},
{q:"திருக்குறளில் மொத்தம் எத்தனை அதிகாரங்கள் உள்ளன?",a:["130","133","380","700"],c:1,e:"திருக்குறளில் மொத்தம் 133 அதிகாரங்கள் உள்ளன."},
{q:"ஒவ்வொரு அதிகாரத்திலும் எத்தனை குறள்கள் உள்ளன?",a:["5","10","20","15"],c:1,e:"ஒவ்வொரு அதிகாரத்திலும் 10 குறள்கள் உள்ளன."},
{q:"திருக்குறளில் மொத்தம் எத்தனை பகுதிகள் உள்ளன?",a:["2","3","4","5"],c:1,e:"திருக்குறள் 3 பகுதிகளைக் கொண்டது."},
{q:"திருக்குறளின் மூன்று பகுதிகள் எவை?",a:["அறத்துப்பால், பொருட்பால், காமத்துப்பால்","அறம், இன்பம், வீடு","கல்வி, பொருள், அரசியல்","அகம், புறம், அறம்"],c:0,e:"திருக்குறளின் மூன்று பகுதிகள் அறத்துப்பால், பொருட்பால், காமத்துப்பால்."},
{q:"அறத்துப்பாலில் எத்தனை அதிகாரங்கள் உள்ளன?",a:["25","38","70","133"],c:1,e:"அறத்துப்பாலில் 38 அதிகாரங்கள் உள்ளன."},
{q:"அறத்துப்பாலில் எத்தனை குறள்கள் உள்ளன?",a:["250","380","700","1330"],c:1,e:"அறத்துப்பாலில் 380 குறள்கள் உள்ளன."},
{q:"பொருட்பாலில் எத்தனை அதிகாரங்கள் உள்ளன?",a:["38","25","70","133"],c:2,e:"பொருட்பாலில் 70 அதிகாரங்கள் உள்ளன."},

{q:"பொருட்பாலில் எத்தனை குறள்கள் உள்ளன?",a:["380","700","250","1330"],c:1,e:"பொருட்பாலில் 700 குறள்கள் உள்ளன."},
{q:"காமத்துப்பாலில் எத்தனை அதிகாரங்கள் உள்ளன?",a:["25","38","70","133"],c:0,e:"காமத்துப்பாலில் 25 அதிகாரங்கள் உள்ளன."},
{q:"காமத்துப்பாலில் எத்தனை குறள்கள் உள்ளன?",a:["250","380","700","1330"],c:0,e:"காமத்துப்பாலில் 250 குறள்கள் உள்ளன."},
{q:"அறத்துப்பால் + பொருட்பால் + காமத்துப்பால் ஆகியவற்றின் மொத்த அதிகாரங்கள் எத்தனை?",a:["100","133","130","1330"],c:1,e:"38 + 70 + 25 = 133 அதிகாரங்கள்."},
{q:"அறத்துப்பால் + பொருட்பால் + காமத்துப்பால் ஆகியவற்றின் மொத்த குறள்கள் எத்தனை?",a:["133","380","1330","700"],c:2,e:"380 + 700 + 250 = 1330 குறள்கள்."},
{q:"திருக்குறளின் மற்றொரு பெயர் எது?",a:["முப்பால்","சிலப்பதிகாரம்","நாலடியார்","புறநானூறு"],c:0,e:"திருக்குறளின் மற்றொரு பெயர் முப்பால்."},
{q:"திருக்குறளின் மற்றொரு பெயர் எது?",a:["பொதுமறை","கம்பராமாயணம்","மணிமேகலை","ஆத்திசூடி"],c:0,e:"திருக்குறள் பொதுமறை என்றும் அழைக்கப்படுகிறது."},
{q:"திருக்குறளின் மற்றொரு பெயர் எது?",a:["தமிழ்மறை","பெரியபுராணம்","திருவாசகம்","சீவக சிந்தாமணி"],c:0,e:"திருக்குறள் தமிழ்மறை என்றும் அழைக்கப்படுகிறது."},
{q:"திருக்குறளின் மற்றொரு பெயர் எது?",a:["உலகப்பொதுமறை","ஐங்குறுநூறு","பத்துப்பாட்டு","கலித்தொகை"],c:0,e:"திருக்குறள் உலகப்பொதுமறை என்றும் அழைக்கப்படுகிறது."},
{q:"திருக்குறளின் மற்றொரு பெயர் எது?",a:["பொய்யாமொழி","பெரியபுராணம்","திருவாசகம்","மணிமேகலை"],c:0,e:"திருக்குறள் பொய்யாமொழி என்றும் அழைக்கப்படுகிறது."},

{q:"கீழ்கண்டவற்றில் திருக்குறளின் மற்றொரு பெயர் எது?",a:["முப்பால்","முத்தமிழ்","முக்கூடல்","முப்பெரும்"],c:0,e:"முப்பால் என்பது திருக்குறளின் மற்றொரு பெயர்."},
{q:"திருக்குறள் ஏன் 'முப்பால்' எனப்படுகிறது?",a:["மூன்று புலவர்கள் இருப்பதால்","மூன்று பகுதிகளைக் கொண்டதால்","மூன்று அதிகாரங்கள் இருப்பதால்","மூன்று குறள்கள் இருப்பதால்"],c:1,e:"திருக்குறள் அறம், பொருள், காமம் என மூன்று பகுதிகளைக் கொண்டதால் முப்பால் எனப்படுகிறது."},
{q:"திருக்குறளின் முதல் பகுதி எது?",a:["பொருட்பால்","காமத்துப்பால்","அறத்துப்பால்","உலகப்பொதுமறை"],c:2,e:"திருக்குறளின் முதல் பகுதி அறத்துப்பால்."},
{q:"திருக்குறளின் இரண்டாம் பகுதி எது?",a:["அறத்துப்பால்","பொருட்பால்","காமத்துப்பால்","முப்பால்"],c:1,e:"திருக்குறளின் இரண்டாம் பகுதி பொருட்பால்."},
{q:"திருக்குறளின் மூன்றாம் பகுதி எது?",a:["அறத்துப்பால்","பொருட்பால்","காமத்துப்பால்","தமிழ்மறை"],c:2,e:"திருக்குறளின் மூன்றாம் பகுதி காமத்துப்பால்."},
{q:"திருக்குறளில் அதிகமான அதிகாரங்களைக் கொண்ட பகுதி எது?",a:["அறத்துப்பால்","பொருட்பால்","காமத்துப்பால்","மூன்றும் சமம்"],c:1,e:"பொருட்பாலில் 70 அதிகாரங்கள் உள்ளதால் அதுவே அதிகம்."},
{q:"திருக்குறளில் குறைந்த அதிகாரங்களைக் கொண்ட பகுதி எது?",a:["அறத்துப்பால்","பொருட்பால்","காமத்துப்பால்","அனைத்தும் சமம்"],c:2,e:"காமத்துப்பாலில் 25 அதிகாரங்கள் உள்ளன."},
{q:"அறத்துப்பால் மற்றும் காமத்துப்பால் சேர்த்து எத்தனை அதிகாரங்கள்?",a:["63","70","95","133"],c:0,e:"38 + 25 = 63 அதிகாரங்கள்."},
{q:"அறத்துப்பால் மற்றும் காமத்துப்பால் சேர்த்து எத்தனை குறள்கள்?",a:["630","500","950","1330"],c:0,e:"380 + 250 = 630 குறள்கள்."},
{q:"பொருட்பால் மற்றும் காமத்துப்பால் சேர்த்து எத்தனை அதிகாரங்கள்?",a:["95","88","63","108"],c:0,e:"70 + 25 = 95 அதிகாரங்கள்."},

{q:"பொருட்பால் மற்றும் காமத்துப்பால் சேர்த்து எத்தனை குறள்கள்?",a:["950","630","700","580"],c:0,e:"700 + 250 = 950 குறள்கள்."},
{q:"திருக்குறளின் ஒவ்வொரு குறளும் எத்தனை அடிகளைக் கொண்டது?",a:["1","2","3","4"],c:1,e:"ஒவ்வொரு குறளும் 2 அடிகளைக் கொண்டது."},
{q:"திருக்குறளின் முதல் அடி எத்தனை சீர்களைக் கொண்டது?",a:["3","4","5","7"],c:1,e:"முதல் அடி 4 சீர்களைக் கொண்டது."},
{q:"திருக்குறளின் இரண்டாம் அடி எத்தனை சீர்களைக் கொண்டது?",a:["2","3","4","5"],c:1,e:"இரண்டாம் அடி 3 சீர்களைக் கொண்டது."},
{q:"ஒரு திருக்குறளில் மொத்தம் எத்தனை சீர்கள் உள்ளன?",a:["5","6","7","8"],c:2,e:"முதல் அடியில் 4 சீர்களும் இரண்டாம் அடியில் 3 சீர்களும் உள்ளதால் மொத்தம் 7 சீர்கள்."},
{q:"4 சீர்கள் கொண்டது திருக்குறளின் எந்த அடி?",a:["முதல் அடி","இரண்டாம் அடி","இரண்டு அடிகளும்","எந்த அடியும் இல்லை"],c:0,e:"திருக்குறளின் முதல் அடி 4 சீர்களைக் கொண்டது."},
{q:"3 சீர்கள் கொண்டது திருக்குறளின் எந்த அடி?",a:["முதல் அடி","இரண்டாம் அடி","இரண்டு அடிகளும்","எந்த அடியும் இல்லை"],c:1,e:"திருக்குறளின் இரண்டாம் அடி 3 சீர்களைக் கொண்டது."},

let selectedTopic="",currentQuestions=[],currentQuestion=0,score=0,answered=false;

function openLesson(title,key){
selectedTopic=key;
homePage.style.display="none";quizPage.style.display="none";lessonPage.style.display="block";
lessonTitle.innerHTML="📖 "+title;
lessonContent.innerHTML=lessons[key]||"<p>இந்த Topic-க்கான Lesson விரைவில் சேர்க்கப்படும்.</p>";
scrollTo(0,0);
}

function startQuizFromLesson(){
currentQuestions=questions[selectedTopic]||[];
if(!currentQuestions.length){alert("இந்த Lesson-க்கான Practice Questions இன்னும் சேர்க்கப்படவில்லை.");return}
currentQuestion=0;score=0;answered=false;
lessonPage.style.display="none";quizPage.style.display="block";
loadQuestion();scrollTo(0,0);
}

function loadQuestion(){
answered=false;
let q=currentQuestions[currentQuestion];
questionNumber.innerText=(currentQuestion+1)+" / "+currentQuestions.length;
questionText.innerText="Q"+(currentQuestion+1)+". "+q.q;
options.innerHTML=q.a.map((x,i)=>`<button class="option" onclick="checkAnswer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join("");
explanation.style.display="none";explanation.innerHTML="";
progressBar.style.width=((currentQuestion/currentQuestions.length)*100)+"%";
nextButton.innerText=currentQuestion===currentQuestions.length-1?"முடிவு":"அடுத்த கேள்வி →";
}

function checkAnswer(selected,button){
if(answered)return;
answered=true;
let q=currentQuestions[currentQuestion],opts=document.querySelectorAll(".option");
opts[q.c].classList.add("correct");
if(selected===q.c)score++;else button.classList.add("wrong");
explanation.innerHTML="💡 <b>விளக்கம்:</b> "+q.e;
explanation.style.display="block";
}

function nextQuestion(){
if(!answered){alert("முதலில் ஒரு பதிலைத் தேர்வு செய்யுங்கள்.");return}
if(currentQuestion<currentQuestions.length-1){currentQuestion++;loadQuestion();scrollTo(0,0)}
else showResult();
}

function showResult(){
let total=currentQuestions.length,p=Math.round(score/total*100);
quizPage.innerHTML=`<div class="quiz-box"><div class="result"><h2>🎉 Quiz முடிந்தது!</h2><p>உங்கள் மதிப்பெண்</p><div class="score">${score} / ${total}</div><h3>${p}%</h3><p>சரியான பதில்கள்: ${score}<br>தவறான பதில்கள்: ${total-score}</p><div class="button-row"><button class="home-btn" onclick="goHome()">🏠 Topics</button><button class="start-btn" onclick="location.reload()">🔄 மீண்டும்</button></div></div></div>`;
}

function goHome(){
lessonPage.style.display="none";quizPage.style.display="none";homePage.style.display="block";scrollTo(0,0);
}
</script>
